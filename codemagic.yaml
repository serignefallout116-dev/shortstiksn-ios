
workflows:
  shortstiksn-ios:
    name: SHORTSTIKSN iOS Test
    max_build_duration: 120
    instance_type: mac_mini_m2
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Generate iOS project
        script: npx cap add ios
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Build iOS app
        script: |
          cd ios/App
          pod install
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
    artifacts:
      - ios/App/build/Build/Products/Release-iphoneos/*.app
